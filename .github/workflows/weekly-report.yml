name: Weekly Report Draft
on:
  schedule:
    # 毎週火曜 14:00 JST = 火曜 05:00 UTC（毎時ちょうどは混雑するため05分にずらす）
    - cron: '5 5 * * 2'
  workflow_dispatch:
    inputs:
      period_end_date:
        description: '作り直し用: その火曜の週分を作り直すときに日付を指定（例: 2026-11-24）。空なら前回実行から今回実行まで'
        required: false
        type: string
        default: ''

concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if manually run today (JST)
        id: check
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            // 今日(JST)すでに手動実行(workflow_dispatch)が成功していれば、自動実行をスキップする
            const jstDate = (iso) =>
              new Date(Date.parse(iso) + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
            const today = jstDate(new Date().toISOString());

            // 自動実行が火曜(JST)のうちに始まらなかった場合は、その週の分として送らずスキップする
            // （GitHubの定期実行が大幅に遅れ、水曜深夜などに届く事故を防ぐ。2026-11-24の回は約10時間半遅れで水曜00:36開始だった）
            const jstWeekday = new Date(Date.now() + 9 * 60 * 60 * 1000).getUTCDay(); // 0=日, 2=火
            if (jstWeekday !== 2) {
              core.notice('自動実行の開始が火曜(JST)ではないため、この回はスキップします。');
              core.setOutput('skip', 'true');
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'weekly-report.yml',
              event: 'workflow_dispatch',
              status: 'success',
              per_page: 20,
            });

            const manualToday = data.workflow_runs.some(r => jstDate(r.created_at) === today);
            if (manualToday) {
              core.notice('今日すでに手動実行が成功しているため、自動実行をスキップします。');
            }
            core.setOutput('skip', manualToday ? 'true' : 'false');

      - name: Generate weekly report drafts
        id: gen
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          DISCORD_CONFIG: ${{ secrets.DISCORD_CONFIG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const config = JSON.parse(process.env.DISCORD_CONFIG);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // GitHubログイン名 -> 学籍番号・氏名の対応表
            const memberInfo = {
              'Akatuki1121': { studentId: '2327004', name: '石田蒼太' },
              'kuroda-R':    { studentId: '2427030', name: '黒田龍成' },
              'rinvivi':     { studentId: '2427026', name: '川口りんね' },
              'Hisu1031':    { studentId: '2427001', name: '会場翔' },
              'yabamao747':  { studentId: '2427051', name: '張梓恵' },
              'yano5555':    { studentId: '2427075', name: '矢野朱華' },
            };

            // 対象期間の決め方
            // ・通常の実行: 前回の生成実行の時刻から今回の実行まで。ただし作り直し実行（火曜以外の手動実行）は
            //   起点に使わず、その前の生成実行まで遡る（作り直しは元の実行の集め直しであり、区切りの時刻は元の実行のものを使う）
            // ・作り直し（締め日を指定した手動実行）: 起点は、指定した火曜より前の直近の火曜の生成実行が
            //   下書きに含めた終わり（その実行時刻）。終わりは、指定した火曜以降にbotが実行されたタイミング
            //   （その週の実行の時刻。無ければ指定した火曜の14:05 JST）
            const DAY_MS = 24 * 60 * 60 * 1000;
            const JST_MS = 9 * 60 * 60 * 1000;
            const jstWall = (date) => new Date(date.getTime() + JST_MS);
            const fmtJstDate = (wall) => wall.toISOString().slice(0, 10);
            function fmtDate(d) {
              // 表示はJSTの日付で出す
              return fmtJstDate(jstWall(d));
            }
            const isTuesdayJst = (date) => jstWall(date).getUTCDay() === 2;

            // 下書き生成まで行った実行（mainでの成功実行のうち、生成ステップが成功したもの）を新しい順に返す
            const listGeneratingRuns = async () => {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'weekly-report.yml',
                status: 'success',
                per_page: 30,
              });
              const result = [];
              for (const r of runs.data.workflow_runs) {
                if (r.id === context.runId) continue;
                if (r.head_branch !== 'main') continue;
                const jobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: r.id,
                });
                const genStep = jobs.data.jobs
                  .flatMap((job) => job.steps || [])
                  .find((step) => step.name === 'Generate weekly report drafts');
                if (!genStep || genStep.conclusion !== 'success') continue;
                result.push({ created: new Date(r.created_at), event: r.event });
              }
              return result;
            };

            let now = new Date();
            let since = null;

            const inputDate = (context.payload.inputs && context.payload.inputs.period_end_date || '').trim();
            if (inputDate) {
              if (!/^\d{4}-\d{2}-\d{2}$/.test(inputDate)) {
                core.setFailed(`period_end_date の形式が不正です: ${inputDate}（YYYY-MM-DDで指定してください）`);
                return;
              }
              const dayStart = new Date(Date.parse(`${inputDate}T00:00:00.000Z`) - JST_MS); // 指定した火曜 00:00 JST
              const runs = await listGeneratingRuns();
              const botRun = runs.find((r) => r.created >= dayStart);
              now = botRun ? botRun.created : new Date(dayStart.getTime() + (14 * 60 + 5) * 60 * 1000);
              const prevTue = runs.find((r) => r.created < dayStart && isTuesdayJst(r.created));
              since = prevTue ? prevTue.created : new Date(now.getTime() - 7 * DAY_MS);
            } else {
              const runs = await listGeneratingRuns();
              const anchor = runs.find((r) => !(r.event === 'workflow_dispatch' && !isTuesdayJst(r.created)));
              since = anchor ? anchor.created : new Date(now.getTime() - 7 * DAY_MS);
            }
            const sinceISO = since.toISOString();
            const untilISO = now.toISOString();

            // 全メンバー（memberInfo のキー = GitHub ログイン名）
            const logins = Object.keys(memberInfo);

            // コミット取得（全ブランチ対象、author 別に集計）
            const commitsByAuthor = {};
            for (const login of logins) commitsByAuthor[login] = [];

            const seenCommitShas = new Set();

            let page = 1;
            while (true) {
              const { data: commits } = await github.rest.repos.listCommits({
                owner,
                repo,
                since: sinceISO,
                until: untilISO,
                per_page: 100,
                page,
              });
              if (commits.length === 0) break;

              for (const c of commits) {
                const sha = c.sha;
                if (seenCommitShas.has(sha)) continue; // 重複 SHA はスキップ
                seenCommitShas.add(sha);

                const login = c.author?.login;
                const message = c.commit.message.split('\n')[0];
                const date = c.commit.author?.date?.slice(0, 10) || '';

                if (login && commitsByAuthor[login]) {
                  commitsByAuthor[login].push(`[${date}] ${message}`);
                } else if (login) {
                  commitsByAuthor[login] = commitsByAuthor[login] || [];
                  commitsByAuthor[login].push(`[${date}] ${message}`);
                }
              }
              if (commits.length < 100) break;
              page++;
            }

            // Issue / PR 取得（作成・クローズ・アサインされたもの）
            const issueEventsByUser = {};
            for (const login of logins) issueEventsByUser[login] = [];

            const { data: issuesAndPRs } = await github.rest.issues.listForRepo({
              owner, repo,
              state: 'all',
              since: sinceISO,
              per_page: 100,
            });

            for (const item of issuesAndPRs) {
              const isPR = !!item.pull_request;
              const kind = isPR ? 'PR' : 'Issue';
              const created = new Date(item.created_at);
              const closed = item.closed_at ? new Date(item.closed_at) : null;

              // 今週作成されたもの → 作成者に記録
              if (created >= since && created <= now) {
                // 自動作成PR(作成者がBot)の場合は assignee(=プッシュした人) を作成者として扱う
                const isBotAuthor = item.user?.type === 'Bot';
                const creators = isBotAuthor
                  ? (item.assignees || []).map(a => a.login)
                  : [item.user?.login];
                for (const login of creators) {
                  if (login && issueEventsByUser[login]) {
                    const key = `${kind}作成:#${item.number}`;
                    if (!issueEventsByUser[login].some(e => e.startsWith(key))) {
                      issueEventsByUser[login].push(`${kind}作成: #${item.number} ${item.title}`);
                    }
                  }
                }
              }

              // 今週クローズされたもの → assignee 全員に記録
              if (closed && closed >= since && closed <= now) {
                const assignees = (item.assignees || []).map(a => a.login);
                for (const a of assignees) {
                  if (issueEventsByUser[a]) {
                    const key = `${kind}クローズ:#${item.number}`;
                    if (!issueEventsByUser[a].some(e => e.startsWith(key))) {
                      issueEventsByUser[a].push(`${kind}クローズ: #${item.number} ${item.title}`);
                    }
                  }
                }
                if (assignees.length === 0 && item.user?.login && issueEventsByUser[item.user.login]) {
                  const key = `${kind}クローズ:#${item.number}`;
                  if (!issueEventsByUser[item.user.login].some(e => e.startsWith(key))) {
                    issueEventsByUser[item.user.login].push(`${kind}クローズ: #${item.number} ${item.title}`);
                  }
                }
              }
            }

            // 出力ディレクトリ
            const outDir = 'weekly-reports/draft';
            fs.mkdirSync(outDir, { recursive: true });
            const weekLabel = `${fmtDate(since)}〜${fmtDate(now)}`;
            const generatedFiles = [];

            for (const login of logins) {
              const commits = commitsByAuthor[login] || [];
              const events = issueEventsByUser[login] || [];
              const info = memberInfo[login] || { studentId: '', name: '' };

              const lines = [];
              lines.push(`学籍番号：${info.studentId}`);
              lines.push(`名前：${info.name}`);
              lines.push('');
              lines.push(`【対象週】${weekLabel}`);
              lines.push('');
              lines.push('■ 今週の作業内容');
              if (commits.length > 0) {
                lines.push('・コミット:');
                for (const c of commits) lines.push(` - ${c}`);
              }
              if (events.length > 0) {
                lines.push('・Issue/PR:');
                for (const e of events) lines.push(` - ${e}`);
              }
              lines.push('');
              lines.push('■ 進捗・成果');
              lines.push('');
              lines.push('■ 備考');
              lines.push('');

              const content = lines.join('\n');
              const fileName = `${info.studentId}_${info.name}.txt`;
              const filePath = path.join(outDir, fileName);
              fs.writeFileSync(filePath, content, 'utf8');
              generatedFiles.push({ login, filePath });
            }

            fs.writeFileSync(
              path.join(outDir, '_generated_files.json'),
              JSON.stringify(generatedFiles),
              'utf8'
            );

            core.setOutput('weekLabel', weekLabel);

      - name: Notify each member on Discord with their draft attached
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEEKLY_WEBHOOK_URL }}
          DISCORD_CONFIG: ${{ secrets.DISCORD_CONFIG }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const config = JSON.parse(process.env.DISCORD_CONFIG);
            const outDir = 'weekly-reports/draft';
            const listPath = path.join(outDir, '_generated_files.json');

            if (!fs.existsSync(listPath)) {
              core.info('生成ファイルなし。通知をスキップします。');
              return;
            }

            const files = JSON.parse(fs.readFileSync(listPath, 'utf8'));

            for (const { login, filePath } of files) {
              const user = config.users[login];
              if (!user?.discordId) {
                core.info(`${login} のDiscordIDが設定されていないためスキップ`);
                continue;
              }

              const form = new FormData();
              const content = `<@${user.discordId}> 今週の週報下書きができました。中身を確認・編集して提出してください。`;
              form.append('payload_json', JSON.stringify({ content }));
              form.append(
                'files[0]',
                new Blob([fs.readFileSync(filePath)], { type: 'text/plain' }),
                path.basename(filePath)
              );

              const res = await fetch(process.env.DISCORD_WEBHOOK_URL, {
                method: 'POST',
                body: form,
              });

              if (!res.ok) {
                core.warning(`${login} への通知に失敗: ${res.status} ${await res.text()}`);
              }
            }
